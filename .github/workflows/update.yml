name: Update Barometer Score

on:
  schedule:
    # 毎日朝6時（日本時間）に自動実行（UTC 21:00）
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行ボタンも用意

jobs:
  update-score:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリのインストール
        run: pip install feedparser google-genai

      - name: スクリプト実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyze.py

      - name: 更新されたscore.jsonを自動コミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add score.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update score" && git push)
